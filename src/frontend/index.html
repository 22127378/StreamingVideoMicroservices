<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StreamForge - Live Video Streaming Platform</title>
  <meta name="description" content="Next-Generation Cloud-Native Video Streaming Platform powered by AWS EKS and Adaptive Bitrate HLS.">
  <link rel="stylesheet" href="./src/styles/main.css">
  <link rel="stylesheet" href="./src/styles/components.css">
  <link rel="stylesheet" href="./src/styles/player.css">
  <link rel="stylesheet" href="./src/styles/chat.css">
  <link rel="stylesheet" href="./src/styles/studio.css">
</head>
<body>
  <div id="app-shell">
    <!-- Top Navigation Bar -->
    <header class="navbar">
      <div class="nav-left">
        <div class="brand-logo" id="nav-brand-btn">
          <svg class="brand-icon-svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span>StreamForge</span>
        </div>
        <nav class="nav-links">
          <a class="nav-link active" id="nav-browse-btn">Browse</a>
          <a class="nav-link" id="nav-categories-btn">Categories</a>
          <a class="nav-link" id="nav-vods-btn">VODs & Replays</a>
        </nav>
      </div>

      <div class="nav-center">
        <div class="search-container">
          <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="11" cy="11" r="8"></circle>
            <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
          </svg>
          <input type="text" class="search-input" id="search-input" placeholder="Search channels, games, creators..." autocomplete="off">
        </div>
      </div>

      <div class="nav-right">
        <!-- Creator Studio Entry Button -->
        <button class="btn btn-outline" id="nav-studio-btn">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M23 7l-7 5 7 5V7z"></path>
            <rect x="1" y="5" width="15" height="14" rx="2" ry="2"></rect>
          </svg>
          <span>Creator Studio</span>
        </button>

        <!-- Unauthenticated Buttons -->
        <div id="auth-unlogged" class="auth-buttons-group">
          <button class="btn btn-secondary" id="btn-open-login">Log In</button>
          <button class="btn btn-primary" id="btn-open-register">Sign Up</button>
        </div>

        <!-- Authenticated User Profile Menu -->
        <div id="auth-logged" class="user-profile-group" style="display: none;">
          <div class="channel-item" id="user-menu-trigger" style="padding: 4px 8px; cursor: pointer;" title="Open Creator Studio">
            <div class="channel-avatar-wrapper" style="width: 32px; height: 32px;">
              <img id="header-user-avatar" class="channel-avatar" src="" alt="User Avatar">
            </div>
            <span id="header-user-name" class="channel-name" style="font-size: 0.85rem;"></span>
          </div>
          <button class="btn btn-icon" id="btn-logout" title="Sign Out">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
          </button>
        </div>
      </div>
    </header>

    <!-- Main Body: Sidebar + Dynamic Main Content -->
    <div id="app-body">
      <!-- Collapsible Channels Sidebar -->
      <aside class="sidebar" id="app-sidebar">
        <div class="sidebar-header">
          <span>Followed Channels</span>
          <button class="sidebar-toggle-btn" id="sidebar-toggle-btn" title="Collapse / Expand Sidebar">
            <svg id="sidebar-toggle-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <polyline points="11 17 6 12 11 7"></polyline>
              <polyline points="18 17 13 12 18 7"></polyline>
            </svg>
          </button>
        </div>
        <div class="channel-list" id="sidebar-followed-list">
          <!-- Populated dynamically by JavaScript -->
        </div>

        <div class="sidebar-header" style="margin-top: 16px;">
          <span>Recommended</span>
        </div>
        <div class="channel-list" id="sidebar-recommended-list">
          <!-- Populated dynamically by JavaScript -->
        </div>
      </aside>

      <!-- Main Dynamic Content Views (Browse, Watch Stream, Studio) -->
      <main id="main-content">
        <!-- Rendered dynamically by app.js router -->
      </main>
    </div>
  </div>

  <!-- Toast Notification Container -->
  <div id="toast-container" style="position: fixed; top: 70px; right: 20px; z-index: 2000; display: flex; flex-direction: column; gap: 10px; pointer-events: none;"></div>

  <!-- Authentication Modal (Login / Register) -->
  <div class="modal-overlay" id="auth-modal">
    <div class="modal-container">
      <!-- Modal Header -->
      <div class="modal-header">
        <div style="display: flex; align-items: center; gap: 8px;">
          <svg class="brand-icon-svg" style="width: 22px; height: 22px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
            <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"></polygon>
          </svg>
          <span class="modal-title" id="auth-modal-header-title">Log in to StreamForge</span>
        </div>
        <button class="modal-close-btn" id="btn-close-modal" title="Close Modal">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <line x1="18" y1="6" x2="6" y2="18"></line>
            <line x1="6" y1="6" x2="18" y2="18"></line>
          </svg>
        </button>
      </div>

      <!-- Modal Tabs -->
      <div class="modal-tabs">
        <div class="modal-tab active" id="modal-tab-login">Log In</div>
        <div class="modal-tab" id="modal-tab-register">Sign Up</div>
      </div>

      <div class="modal-body">
        <div id="auth-alert" style="display: none; padding: 10px 14px; border-radius: 4px; font-size: 0.85rem; line-height: 1.4;"></div>

        <!-- Login Form -->
        <form id="form-login" class="form-container">
          <div class="form-group">
            <label class="form-label">Username or Email</label>
            <input type="text" class="form-input" id="login-identifier" required placeholder="Enter username or email" autofocus>
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="login-password" required placeholder="Enter password">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; height: 40px; font-size: 0.95rem;">Log In</button>
          
          <div style="text-align: center; margin-top: 14px; font-size: 0.85rem; color: var(--text-secondary);">
            Don't have an account? <a href="javascript:void(0)" id="link-switch-to-register" style="color: var(--accent-purple-light); font-weight: 600;">Sign Up</a>
          </div>
        </form>

        <!-- Register Form -->
        <form id="form-register" class="form-container" style="display: none;">
          <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" class="form-input" id="reg-username" required placeholder="Choose a unique username" minlength="3">
          </div>
          <div class="form-group">
            <label class="form-label">Display Name (Channel Name)</label>
            <input type="text" class="form-input" id="reg-displayname" placeholder="Channel Display Name (e.g. ProGamer)">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="email" class="form-input" id="reg-email" required placeholder="name@example.com">
          </div>
          <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" class="form-input" id="reg-password" required minlength="6" placeholder="Create strong password (6+ chars)">
          </div>
          <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px; height: 40px; font-size: 0.95rem;">Create Account</button>
          
          <div style="text-align: center; margin-top: 14px; font-size: 0.85rem; color: var(--text-secondary);">
            Already have an account? <a href="javascript:void(0)" id="link-switch-to-login" style="color: var(--accent-purple-light); font-weight: 600;">Log In</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script type="module" src="./src/js/app.js"></script>
</body>
</html>
