# ==============================================================================
# chat-service Kubernetes Deployment + Service + ServiceAccount
# Port: 4004 | WebSocket: /ws | REST: /api/chat/*
# WebSocket requires target-type: ip and long idle timeout (handled at Ingress)
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamforge-chat-sa
  namespace: streamforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/streamforge-api-irsa-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-chat
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-chat
    app.kubernetes.io/component: chat-service
    app.kubernetes.io/part-of: streamforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamforge-chat
  strategy:
    # WebSocket connections are long-lived — use Recreate only in dev.
    # In production use RollingUpdate with long terminationGracePeriod.
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamforge-chat
        app.kubernetes.io/component: chat-service
    spec:
      serviceAccountName: streamforge-chat-sa
      # Long grace period: give time for WS connections to drain naturally
      terminationGracePeriodSeconds: 120
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: streamforge-chat
      containers:
        - name: chat-service
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-chat-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4004
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4004"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: AWS_REGION
            - name: DYNAMODB_TABLE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: DYNAMODB_TABLE_PREFIX
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: JWT_SECRET
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            # Chat service is I/O bound (many open WS connections), not CPU
            requests: { cpu: "200m", memory: "256Mi" }
            limits:   { cpu: "800m", memory: "768Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-chat
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-chat
    app.kubernetes.io/component: chat-service
  annotations:
    # Ensure WebSocket connections use IP routing, not node port
    service.beta.kubernetes.io/aws-load-balancer-type: "external"
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streamforge-chat
  ports:
    - name: http
      port: 4004
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamforge-chat-hpa
  namespace: streamforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamforge-chat
  minReplicas: 2
  maxReplicas: 12   # Chat can have many concurrent connections; scale more aggressively
  metrics:
    - type: Resource
      resource:
        name: memory   # Chat is memory-bound (WS state), not CPU
        target: { type: Utilization, averageUtilization: 70 }
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 80 }
