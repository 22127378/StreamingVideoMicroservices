# ==============================================================================
# StreamForge Frontend SPA - Kubernetes Deployment
# Runs the Nginx-served Vite static SPA on AWS EKS.
#
# Key design decisions:
# - readOnlyRootFilesystem=true with emptyDir tmpfs for /tmp and Nginx cache.
#   This hardens the container without breaking Nginx write access patterns.
# - Anti-affinity rule prevents two frontend pods landing on the same node so
#   a single Spot preemption cannot cause complete frontend unavailability.
# - Lighter resource footprint than the API tier; Nginx is CPU-efficient for
#   static file serving, but memory can spike during large concurrent requests.
# ==============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-frontend
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-frontend
    app.kubernetes.io/component: frontend
    app.kubernetes.io/part-of: streamforge
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamforge-frontend
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamforge-frontend
        app.kubernetes.io/component: frontend
        app.kubernetes.io/part-of: streamforge
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false  # Frontend needs no AWS access

      # Pod anti-affinity: prevent co-location on the same node
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchLabels:
                    app.kubernetes.io/name: streamforge-frontend
                topologyKey: kubernetes.io/hostname

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: streamforge-frontend

      terminationGracePeriodSeconds: 30

      containers:
        - name: frontend
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-frontend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          env:
            - name: NGINX_HOST
              value: "0.0.0.0"
            - name: NGINX_PORT
              value: "80"

          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 3
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101      # nginx user
            capabilities:
              drop:
                - ALL

          # Nginx requires write access to /tmp and its cache dirs
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run

      volumes:
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 64Mi
        - name: nginx-cache
          emptyDir:
            medium: Memory
            sizeLimit: 128Mi
        - name: nginx-run
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi

      securityContext:
        fsGroup: 101

---
# ==============================================================================
# HorizontalPodAutoscaler: scale 2-6 pods on CPU
# ==============================================================================
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamforge-frontend-hpa
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-frontend
    app.kubernetes.io/component: frontend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamforge-frontend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
