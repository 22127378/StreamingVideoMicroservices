# ==============================================================================
# StreamForge - AWS ALB Ingress (Kubernetes IngressClass: alb)
#
# Traffic flow:
#   Internet -> CloudFront CDN (Terminates HTTPS)
#     -> ALB (HTTP:80, validates X-Origin-Verify secret header)
#       -> /*      -> streamforge-api:4000 (Monolith API & WebSockets)
# ==============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: streamforge-ingress
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-ingress
    app.kubernetes.io/part-of: streamforge
  annotations:
    # ---- Core ALB Controller Annotations ----
    kubernetes.io/ingress.class: "alb"
    alb.ingress.kubernetes.io/scheme: "internet-facing"
    alb.ingress.kubernetes.io/target-type: "ip"  # Required for WebSocket (pod IP routing)
    alb.ingress.kubernetes.io/load-balancer-name: "streamforge-alb"

    # ---- HTTP Only (CloudFront handles HTTPS) ----
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'

    # ---- CloudFront-Only Access: Reject requests without secret header ----
    alb.ingress.kubernetes.io/conditions.verify-origin: >
      [{"field":"http-header","httpHeaderConfig":{"httpHeaderName":"X-Origin-Verify","values":["streamforge-origin-secret"]}}]

    # ---- WebSocket Idle Timeout ----
    alb.ingress.kubernetes.io/load-balancer-attributes: >
      idle_timeout.timeout_seconds=3600,
      routing.http2.enabled=true,
      access_logs.s3.enabled=false

    # ---- Health Check ----
    alb.ingress.kubernetes.io/healthcheck-path: "/api/health"
    alb.ingress.kubernetes.io/healthcheck-interval-seconds: "15"
    alb.ingress.kubernetes.io/healthcheck-timeout-seconds: "5"
    alb.ingress.kubernetes.io/success-codes: "200"

    # ---- Target Group Attributes ----
    alb.ingress.kubernetes.io/target-group-attributes: >
      stickiness.enabled=false,
      deregistration_delay.timeout_seconds=30

spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          # All requests go to the monolithic API
          - path: /
            pathType: Prefix
            backend:
              service:
                name: streamforge-api
                port:
                  number: 4000
