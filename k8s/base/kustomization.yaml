# ==============================================================================
# StreamForge - Kustomize Base Configuration
#
# Kustomize is used to manage the base manifests and allow environment-specific
# overlays (e.g. staging vs production) to patch values like replica counts,
# image tags, and resource limits without duplicating YAML.
#
# Usage:
#   Apply base directly:
#     kubectl apply -k k8s/base/
#
#   Apply with image override (CI/CD):
#     kustomize edit set image \
#       AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-api=:v1.2.3
#     kubectl apply -k k8s/base/
#
#   ArgoCD points its Application to this directory and syncs automatically.
# ==============================================================================
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# Namespace applied to all resources in this base
namespace: streamforge

# All resources in the base layer
  # ---- Microservices ----
  # ---- Frontend ----
  # ---- KEDA Transcoder ----
  # ---- ALB Ingress ----
resources:
- namespace.yaml
- configmap-and-secret.yaml
- auth-service-deployment.yaml
- channel-service-deployment.yaml
- vod-service-deployment.yaml
- chat-service-deployment.yaml
- frontend-deployment.yaml
- frontend-service.yaml
- keda-transcoder-scaledobject.yaml
- ingress-alb.yaml
  # ---- Legacy API (deprecated — remove after full microservices cutover) ----
  # - api-deployment.yaml
  # - api-service.yaml

# Common labels added to ALL resources by Kustomize
commonLabels:
  app.kubernetes.io/part-of: streamforge
  environment: production

# Image management: CI/CD pipeline overwrites these via `kustomize edit set image`
  # Microservices
  # Other services
images:
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-auth-service
  newTag: latest
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-channel-service
  newTag: latest
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-chat-service
  newTag: latest
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-frontend
  newTag: latest
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-transcoder
  newTag: latest
- name: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-vod-service
  newTag: latest
- name: streamforge/api
  newName: 037547369060.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge/api
  newTag: d348f2d
- name: streamforge/worker
  newName: 037547369060.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge/transcoder-worker
  newTag: d348f2d
