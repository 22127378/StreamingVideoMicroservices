# ==============================================================================
# vod-service Kubernetes Deployment + Service + ServiceAccount
# Port: 4003 | REST: /api/vods/*
# ==============================================================================
apiVersion: v1
kind: ServiceAccount
metadata:
  name: streamforge-vod-sa
  namespace: streamforge
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::AWS_ACCOUNT_ID:role/streamforge-api-irsa-role"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: streamforge-vod
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-vod
    app.kubernetes.io/component: vod-service
    app.kubernetes.io/part-of: streamforge
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: streamforge-vod
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxSurge: 1, maxUnavailable: 0 }
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamforge-vod
        app.kubernetes.io/component: vod-service
    spec:
      serviceAccountName: streamforge-vod-sa
      terminationGracePeriodSeconds: 30
      containers:
        - name: vod-service
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-vod-service:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4003
          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4003"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: AWS_REGION
            - name: DYNAMODB_TABLE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: DYNAMODB_TABLE_PREFIX
            - name: S3_RAW_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: S3_RAW_BUCKET
            - name: S3_HLS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: S3_HLS_BUCKET
            - name: CLOUDFRONT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: CLOUDFRONT_DOMAIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: JWT_SECRET
            - name: CLOUDFRONT_KEY_PAIR_ID
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: CLOUDFRONT_KEY_PAIR_ID
            - name: CLOUDFRONT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: CLOUDFRONT_PRIVATE_KEY
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 10
            periodSeconds: 10
          resources:
            requests: { cpu: "150m", memory: "256Mi" }
            limits:   { cpu: "500m", memory: "512Mi" }
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities: { drop: ["ALL"] }
---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-vod
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-vod
    app.kubernetes.io/component: vod-service
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streamforge-vod
  ports:
    - name: http
      port: 4003
      targetPort: http
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: streamforge-vod-hpa
  namespace: streamforge
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: streamforge-vod
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
