# ==============================================================================
# StreamForge - Shared ConfigMap & Secrets (placeholder templates)
#
# IMPORTANT: These manifests contain placeholder values only.
# Real values are injected by the CI/CD pipeline (GitHub Actions) at deploy time
# using `kubectl create secret` with values sourced from GitHub Secrets or
# AWS Secrets Manager (via External Secrets Operator).
#
# ConfigMap:  Non-sensitive environment configuration shared by all pods.
# Secret:     Sensitive credentials managed outside of Git (never committed).
# ==============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: streamforge-config
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-config
    app.kubernetes.io/part-of: streamforge
    app.kubernetes.io/managed-by: argocd
data:
  # AWS Region where all resources are deployed
  AWS_REGION: "ap-southeast-1"

  # DynamoDB explicit table names
  DYNAMODB_TABLE_USERS: "streamforge_Users"
  DYNAMODB_TABLE_CHANNELS: "streamforge_Channels"
  DYNAMODB_TABLE_STREAMS: "streamforge_Streams"
  DYNAMODB_TABLE_FOLLOWS: "streamforge_Follows"
  # S3 Bucket names (from terraform output)
  S3_RAW_BUCKET: "streamforge-raw-media-037547369060-ap-southeast-1"
  S3_HLS_BUCKET: "streamforge-hls-delivery-037547369060-ap-southeast-1"

  # CloudFront distribution domain (from terraform output)
  CLOUDFRONT_DOMAIN: "d17c0kiwp2waq7.cloudfront.net"

  # SQS Transcode Queue URL (from terraform output)
  SQS_TRANSCODE_QUEUE_URL: "https://sqs.ap-southeast-1.amazonaws.com/037547369060/streamforge-transcode-queue"

---
# ==============================================================================
# Secret Template: DO NOT commit real values.
# Create this secret in cluster with:
#   kubectl create secret generic streamforge-secrets \
#     --namespace=streamforge \
#     --from-literal=JWT_SECRET="$(openssl rand -hex 64)" \
#     --from-literal=X_ORIGIN_VERIFY_SECRET="<from-terraform-output>" \
#     --from-literal=CLOUDFRONT_KEY_PAIR_ID="<from-terraform-output>" \
#     --from-literal=CLOUDFRONT_PRIVATE_KEY="$(cat cf_private_key.pem)"
# ==============================================================================
apiVersion: v1
kind: Secret
metadata:
  name: streamforge-secrets
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-secrets
    app.kubernetes.io/part-of: streamforge
  annotations:
    # Managed by External Secrets Operator (ESO) in production
    # Synced from AWS Secrets Manager: arn:aws:secretsmanager:ap-southeast-1:ACCOUNT_ID:secret:streamforge/prod
    reloader.stakater.com/match: "true"
type: Opaque
stringData:
  # JWT signing secret (minimum 64 hex chars / 256 bits)
  JWT_SECRET: "REPLACE_WITH_STRONG_SECRET_AT_DEPLOY_TIME"
  # Header value CloudFront injects; ALB rejects requests missing this
  X_ORIGIN_VERIFY_SECRET: "REPLACE_WITH_TERRAFORM_OUTPUT"
  # CloudFront Signed Cookies - Key Pair ID from terraform module 10-cloudfront
  CLOUDFRONT_KEY_PAIR_ID: "REPLACE_WITH_TERRAFORM_OUTPUT"
  # CloudFront Signed Cookies - RSA Private Key (PEM format)
  CLOUDFRONT_PRIVATE_KEY: "REPLACE_WITH_PEM_PRIVATE_KEY"
