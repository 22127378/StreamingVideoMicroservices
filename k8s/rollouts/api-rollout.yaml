# ==============================================================================
# StreamForge API - Argo Rollouts Canary Deployment
#
# Replaces the standard Kubernetes Deployment for the API service with an
# Argo Rollout that implements a progressive Canary delivery strategy.
#
# Canary Traffic Progression:
#   Step 1:  10% traffic -> canary pods         (pause 2 min for analysis)
#   Step 2:  30% traffic -> canary pods         (pause 5 min for analysis)
#   Step 3:  60% traffic -> canary pods         (pause 5 min for analysis)
#   Step 4: 100% traffic -> canary promoted to stable
#
# Automatic Rollback triggers:
#   - AnalysisTemplate "streamforge-api-success-rate" fails (HTTP 5xx rate > 1%)
#   - AnalysisTemplate "streamforge-api-latency-p99" fails (p99 > 500ms)
#
# How it integrates with ALB Ingress Controller:
#   The Rollout manages two Services: stable and canary.
#   The ALB Ingress annotation `alb.ingress.kubernetes.io/actions.*` references
#   a weighted target group split that shifts traffic at each step boundary.
#
# IMPORTANT: Delete the api-deployment.yaml Deployment before applying this
# Rollout. They manage the same pod selector and will conflict.
# ==============================================================================
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: streamforge-api-rollout
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-api
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: streamforge
    app.kubernetes.io/managed-by: argocd
spec:
  replicas: 2

  selector:
    matchLabels:
      app.kubernetes.io/name: streamforge-api

  # ---- Canary Strategy ----
  strategy:
    canary:
      # Stable service receives stable-version traffic
      stableService: streamforge-api-stable
      # Canary service receives new-version traffic
      canaryService: streamforge-api-canary

      # ALB traffic weights are managed via weighted target groups
      trafficRouting:
        alb:
          ingress: streamforge-ingress
          servicePort: 80
          annotationPrefix: alb.ingress.kubernetes.io  # Default ALB controller prefix

      # Automated analysis runs in background during each pause step
      analysis:
        templates:
          - templateName: streamforge-api-success-rate
          - templateName: streamforge-api-latency-p99
        startingStep: 1   # Start analysis immediately from step 1
        args:
          - name: service-name
            value: streamforge-api-canary

      # Traffic progression steps
      steps:
        # Step 1: 10% canary traffic | wait 2 min
        - setWeight: 10
        - pause:
            duration: 2m

        # Step 2: 30% canary traffic | wait 5 min
        - setWeight: 30
        - pause:
            duration: 5m

        # Step 3: 60% canary traffic | wait 5 min for final validation
        - setWeight: 60
        - pause:
            duration: 5m

        # Step 4: Full promotion (100%) — done automatically if analysis passes
        - setWeight: 100

  # ---- Pod Template (identical to api-deployment.yaml) ----
  template:
    metadata:
      labels:
        app.kubernetes.io/name: streamforge-api
        app.kubernetes.io/component: backend
        app.kubernetes.io/part-of: streamforge
    spec:
      serviceAccountName: streamforge-api-sa
      automountServiceAccountToken: true

      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: streamforge-api

      terminationGracePeriodSeconds: 60

      containers:
        - name: api
          image: AWS_ACCOUNT_ID.dkr.ecr.ap-southeast-1.amazonaws.com/streamforge-api:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP

          env:
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "4000"
            - name: AWS_REGION
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: AWS_REGION
            - name: DYNAMODB_TABLE_PREFIX
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: DYNAMODB_TABLE_PREFIX
            - name: S3_RAW_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: S3_RAW_BUCKET
            - name: S3_HLS_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: S3_HLS_BUCKET
            - name: CLOUDFRONT_DOMAIN
              valueFrom:
                configMapKeyRef:
                  name: streamforge-config
                  key: CLOUDFRONT_DOMAIN
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: JWT_SECRET
            - name: CLOUDFRONT_KEY_PAIR_ID
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: CLOUDFRONT_KEY_PAIR_ID
            - name: CLOUDFRONT_PRIVATE_KEY
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: CLOUDFRONT_PRIVATE_KEY
            - name: X_ORIGIN_VERIFY_SECRET
              valueFrom:
                secretKeyRef:
                  name: streamforge-secrets
                  key: X_ORIGIN_VERIFY_SECRET

          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3

          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3

          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "512Mi"

          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            runAsNonRoot: true
            runAsUser: 1001
            capabilities:
              drop:
                - ALL

      securityContext:
        fsGroup: 1001

---
# ==============================================================================
# Two Services required by Argo Rollouts ALB traffic splitting:
# - streamforge-api-stable: receives production (stable) traffic
# - streamforge-api-canary: receives new-version (canary) traffic
#
# Argo Rollouts controller dynamically updates the pod selectors of these
# services to point to stable vs canary pods as the rollout progresses.
# ==============================================================================
apiVersion: v1
kind: Service
metadata:
  name: streamforge-api-stable
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-api
    app.kubernetes.io/component: backend
    argo-rollouts-service-type: stable
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streamforge-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: websocket
      port: 4000
      targetPort: http
      protocol: TCP

---
apiVersion: v1
kind: Service
metadata:
  name: streamforge-api-canary
  namespace: streamforge
  labels:
    app.kubernetes.io/name: streamforge-api
    app.kubernetes.io/component: backend
    argo-rollouts-service-type: canary
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: streamforge-api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: websocket
      port: 4000
      targetPort: http
      protocol: TCP
